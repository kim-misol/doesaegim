name: Supabase keep-alive

# Free-tier Supabase projects are paused after ~7 days without DB activity.
# Ping the REST API twice a week (well inside that window) so the project
# stays active without upgrading to a paid plan. See docs/SUPABASE.md.
# No-op (skips) if the Supabase secrets aren't configured.

on:
  schedule:
    - cron: "0 3 * * 1,4" # Mon & Thu 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to keep the free project active
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not set — nothing to keep alive, skipping."
            exit 0
          fi
          # RLS means this returns an empty array for the anon key (no user
          # JWT), but the request still reaches Postgres, which is what
          # counts as "activity" for Supabase's pause check.
          curl -s -o /dev/null -w "supabase keep-alive ping: HTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/words?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
